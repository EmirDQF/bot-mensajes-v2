<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Realtime Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body { height: 100%; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .chat-scroll::-webkit-scrollbar { width: 8px; }
      .chat-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.5); border-radius: 9999px; }
      .message-bubble { max-width: min(72%, 560px); word-break: break-word; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div class="flex h-screen overflow-hidden">
      <aside class="w-full max-w-sm border-r border-slate-800 bg-slate-900/80">
        <div class="border-b border-slate-800 p-4">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs uppercase tracking-[0.24em] text-emerald-400">Realtime</p>
              <h1 class="mt-1 text-xl font-semibold">Conversaciones</h1>
            </div>
            <span class="inline-flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2.5 py-1 text-[10px] font-medium uppercase tracking-[0.2em] text-emerald-300">
              <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
              Live
            </span>
          </div>
        </div>
        <div id="contactList" class="chat-scroll h-[calc(100vh-77px)] overflow-y-auto p-3"></div>
      </aside>

      <main class="flex min-w-0 flex-1 flex-col bg-slate-950">
        <header class="flex items-center justify-between border-b border-slate-800 bg-slate-900/70 px-5 py-4">
          <div>
            <p id="selectedContactLabel" class="text-lg font-semibold text-white">Selecciona una conversación</p>
            <p id="selectedContactMeta" class="text-xs text-slate-400">Esperando mensajes...</p>
          </div>
          <div class="rounded-full border border-slate-700 bg-slate-800 px-3 py-1 text-xs font-medium text-slate-300">
            Supabase messages
          </div>
        </header>

        <div id="messagesContainer" class="chat-scroll flex-1 space-y-3 overflow-y-auto px-4 py-5"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-panel.js"></script>
  </body>
</html>
