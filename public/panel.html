<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel de la clínica</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app/main.js"></script>
  </head>
  <body data-view="inbox">
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <!-- Inicio de sesión -->
    <main id="login" class="login" hidden>
      <form id="loginForm" class="login__card" autocomplete="on">
        <h1 class="login__title">Panel de la clínica</h1>
        <p class="login__hint">Ingresa con el usuario de recepción o del dueño.</p>
        <label for="loginUser">Usuario</label>
        <input id="loginUser" name="username" type="text" autocomplete="username" required />
        <label for="loginPass">Contraseña</label>
        <input id="loginPass" name="password" type="password" autocomplete="current-password" required />
        <p id="loginError" class="login__error" role="alert"></p>
        <button id="loginSubmit" type="submit" class="btn btn--primary btn--block">Ingresar</button>
      </form>
    </main>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="brand">
          <img id="brandLogo" class="brand__logo" alt="" hidden />
          <span id="brandName" class="brand__name">Panel</span>
        </div>
        <nav id="tabs" class="tabs" role="tablist" aria-label="Secciones del panel"></nav>
        <div class="topbar__actions">
          <span id="liveStatus" class="live" data-status="reconnecting" role="status" aria-live="polite">
            <span class="live__dot" aria-hidden="true"></span><span id="liveStatusText">Conectando…</span>
          </span>
          <label class="switch" title="Sonido y notificación para urgencias y solicitudes">
            <input id="alertsToggle" type="checkbox" />
            <span class="switch__track" aria-hidden="true"></span>
            <span class="switch__label">🔔 Alertas</span>
          </label>
          <span id="sessionRole" class="role-chip"></span>
          <button id="logoutBtn" type="button" class="btn btn--ghost">Salir</button>
        </div>
      </header>

      <main id="main" class="views">
        <!-- Bandeja -->
        <section id="view-inbox" class="view view--inbox" role="tabpanel" aria-labelledby="tab-inbox">
          <aside class="inbox" aria-label="Conversaciones">
            <div class="inbox__search">
              <label for="inboxSearch" class="sr-only">Buscar por nombre, teléfono o mensaje</label>
              <input id="inboxSearch" type="search" placeholder="Buscar por nombre, teléfono o mensaje" />
            </div>
            <div id="inboxFilters" class="chips" role="group" aria-label="Filtros"></div>
            <p id="inboxCount" class="inbox__count" aria-live="polite"></p>
            <div id="inboxList" class="inbox__list"></div>
          </aside>

          <section class="chat-pane" aria-label="Conversación">
            <div id="chatEmpty" class="chat-empty">
              <p class="state__title">Elige una conversación</p>
              <p class="state__hint">Los mensajes llegan en vivo. Si respondes desde aquí, el asistente se pausa en esa conversación.</p>
            </div>
            <div id="chat" class="chat" hidden>
              <header class="chat__header">
                <button id="btnBackToList" type="button" class="btn btn--ghost chat__back" aria-label="Volver a la lista">←</button>
                <span id="chatAvatar" class="avatar" aria-hidden="true"></span>
                <div class="chat__who">
                  <h2 id="chatName" class="chat__name"></h2>
                  <p id="chatPhone" class="chat__phone"></p>
                  <p id="chatBadges" class="chat__badges"></p>
                </div>
                <div class="chat__actions">
                  <span id="chatBotState" class="bot-state" role="status"></span>
                  <button id="btnIntervene" type="button" class="btn btn--warn">Intervenir</button>
                  <button id="btnBackToBot" type="button" class="btn btn--primary" hidden>Devolver al bot</button>
                  <button id="btnProfile" type="button" class="btn btn--ghost" aria-expanded="false" aria-controls="profile">Ficha</button>
                </div>
              </header>
              <div class="chat__body">
                <div class="chat__column">
                  <div id="chatMessages" class="chat__messages" aria-live="polite" aria-label="Mensajes"></div>
                  <p id="typingIndicator" class="typing" hidden role="status"><span class="typing__dots" aria-hidden="true"><i></i><i></i><i></i></span> Bot escribiendo…</p>
                  <div id="windowNotice" class="window-notice" hidden></div>
                  <div id="quickReplies" class="chips chips--quick" aria-label="Respuestas rápidas" hidden></div>
                  <form id="composer" class="composer">
                    <label for="composerText" class="sr-only">Mensaje para el paciente</label>
                    <textarea id="composerText" rows="1" maxlength="4096" placeholder="Escribe como recepción… (Enter envía, Shift+Enter hace un salto de línea)"></textarea>
                    <button id="btnSend" type="submit" class="btn btn--primary">Enviar</button>
                  </form>
                </div>
                <aside id="profile" class="profile" hidden aria-label="Ficha del paciente"></aside>
              </div>
            </div>
          </section>
        </section>

        <!-- Agenda -->
        <section id="view-agenda" class="view view--scroll" role="tabpanel" aria-labelledby="tab-agenda" hidden>
          <div class="toolbar">
            <div id="agendaDays" class="segmented" role="group" aria-label="Día">
              <button type="button" class="is-active" aria-pressed="true" data-day="today">Hoy</button>
              <button type="button" aria-pressed="false" data-day="tomorrow">Mañana</button>
            </div>
            <span id="agendaLabel" class="toolbar__label"></span>
          </div>
          <div id="agendaList" class="agenda" aria-live="polite"></div>
        </section>

        <!-- Métricas -->
        <section id="view-metrics" class="view view--scroll" role="tabpanel" aria-labelledby="tab-metrics" hidden>
          <div class="toolbar">
            <label for="metricsDays" class="toolbar__label">Periodo</label>
            <select id="metricsDays">
              <option value="7">Últimos 7 días</option>
              <option value="30" selected>Últimos 30 días</option>
              <option value="90">Últimos 90 días</option>
            </select>
          </div>
          <div id="metricsTiles" class="metrics-tiles"></div>
          <h3 class="section-title">Citas por anuncio</h3>
          <div id="metricsByAd" class="ad-list"></div>
        </section>

        <!-- Reporte -->
        <section id="view-report" class="view view--scroll" role="tabpanel" aria-labelledby="tab-report" hidden>
          <div class="toolbar no-print">
            <label for="reportFrom" class="toolbar__label">Desde</label>
            <input type="date" id="reportFrom" />
            <label for="reportTo" class="toolbar__label">Hasta</label>
            <input type="date" id="reportTo" />
            <button type="button" id="reportRun" class="btn">Generar</button>
            <button type="button" id="reportPrint" class="btn">🖨️ Imprimir / PDF</button>
          </div>
          <article id="reportSheet" class="report-sheet" aria-live="polite"></article>
        </section>

        <!-- Configuración (solo el dueño) -->
        <section id="view-config" class="view view--scroll" role="tabpanel" aria-labelledby="tab-config" hidden></section>

        <!-- Probador (solo el dueño) -->
        <section id="view-tester" class="view view--tester" role="tabpanel" aria-labelledby="tab-tester" hidden></section>
      </main>
    </div>

    <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Foto ampliada">
      <button id="lightboxClose" type="button" class="lightbox__close" aria-label="Cerrar">×</button>
      <img id="lightboxImage" alt="Foto ampliada" />
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
